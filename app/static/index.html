<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>وكيل التسويق</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #14171f; }
      h1 { font-size: 22px; margin: 0 0 16px; }
      .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
      .card { background: #fff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 16px; }
      label { display: block; font-size: 13px; margin: 10px 0 4px; color: #4a5160; }
      input, textarea, select, button { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid #d5d9e0; border-radius: 8px; background: #fff; }
      button { background: #1f6feb; color: #fff; border: none; cursor: pointer; margin-top: 12px; }
      button.secondary { background: #eef1f5; color: #14171f; margin: 0; width: auto; padding: 5px 10px; font-size: 13px; white-space: nowrap; }
      button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: right; padding: 8px; border-bottom: 1px solid #eceef2; vertical-align: top; }
      .status { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef1f5; }
      .status.published { background: #dcfce7; }
      .status.failed { background: #fee2e2; }
      .status.approved { background: #dbeafe; }
      .row { display: flex; gap: 6px; }
      .muted { color: #6b7280; font-size: 12px; }
      .error { display: block; margin-top: 6px; color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>وكيل التسويق — توليد وجدولة ونشر</h1>
    <div class="grid">
      <div class="card">
        <h2 style="font-size:16px;margin:0">حملة جديدة</h2>
        <label>اسم الحملة</label>
        <input id="name" placeholder="إطلاق المنتج" />
        <label>الهدف</label>
        <input id="goal" placeholder="زيادة التسجيلات" />
        <label>الجمهور</label>
        <input id="audience" placeholder="أصحاب المشاريع الصغيرة" />
        <label>نبرة العلامة</label>
        <input id="voice" placeholder="ودّي ومباشر" />
        <label>الهاشتاجات</label>
        <input id="hashtags" placeholder="#تسويق #ريادة" />
        <label>المنصات</label>
        <select id="platforms" multiple size="3">
          <option value="facebook" selected>Facebook</option>
          <option value="instagram" selected>Instagram</option>
          <option value="tiktok">TikTok</option>
        </select>
        <label>رابط الميديا (مطلوب لإنستجرام وتيك توك)</label>
        <input id="media" placeholder="https://..." />
        <label>عدد المنشورات لكل منصة</label>
        <input id="count" type="number" value="1" min="1" max="5" />
        <label>الفاصل بين المنشورات (ساعات)</label>
        <input id="interval" type="number" value="24" min="0" />
        <button id="generate">ولّد المنشورات</button>
        <p class="muted" id="msg"></p>
      </div>

      <div class="card">
        <h2 style="font-size:16px;margin:0 0 12px">المنشورات</h2>
        <table>
          <thead>
            <tr><th>المنصة</th><th>النص</th><th>الموعد</th><th>الحالة</th><th></th></tr>
          </thead>
          <tbody id="posts"></tbody>
        </table>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const api = async (url, options) => {
        const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        return res.status === 204 ? null : res.json();
      };

      async function loadPosts() {
        const posts = await api("/api/posts");
        $("posts").innerHTML = posts
          .map(
            (p) => `<tr>
              <td>${p.platform}</td>
              <td>${p.caption.replace(/</g, "&lt;")}${p.error ? `<div class="muted error">${p.error}</div>` : ""}</td>
              <td class="muted">${new Date(p.scheduled_at + "Z").toLocaleString()}</td>
              <td><span class="status ${p.status}">${p.status}</span></td>
              <td class="row">
                <button class="secondary" onclick="approve(event, ${p.id})" ${p.status === "draft" || p.status === "failed" ? "" : "disabled"}>اعتماد</button>
                <button class="secondary" onclick="publishNow(event, ${p.id})" ${p.status === "published" ? "disabled" : ""}>نشر الآن</button>
              </td>
            </tr>`
          )
          .join("");
      }

      async function act(event, url) {
        const row = event.target.closest("tr");
        row.querySelectorAll("button").forEach((b) => (b.disabled = true));
        await api(url, { method: "POST" }).catch((e) => ($("msg").textContent = e.message));
        loadPosts();
      }

      const approve = (event, id) => act(event, `/api/posts/${id}/approve`);
      const publishNow = (event, id) => act(event, `/api/posts/${id}/publish`);

      $("generate").onclick = async () => {
        $("msg").textContent = "جاري التوليد...";
        try {
          const campaign = await api("/api/campaigns", {
            method: "POST",
            body: JSON.stringify({
              name: $("name").value || "حملة بدون اسم",
              goal: $("goal").value,
              audience: $("audience").value,
              brand_voice: $("voice").value,
              hashtags: $("hashtags").value,
            }),
          });
          await api(`/api/campaigns/${campaign.id}/generate`, {
            method: "POST",
            body: JSON.stringify({
              platforms: [...$("platforms").selectedOptions].map((o) => o.value),
              count_per_platform: Number($("count").value),
              interval_hours: Number($("interval").value),
              media_url: $("media").value || null,
            }),
          });
          $("msg").textContent = "تم التوليد ✅ راجع المنشورات واعتمدها";
          loadPosts();
        } catch (e) {
          $("msg").textContent = e.message;
        }
      };

      loadPosts();
      setInterval(loadPosts, 15000);
    </script>
  </body>
</html>
